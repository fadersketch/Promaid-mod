description="更智能的车万女仆（原 maid_smart 改名重组 v1.0.4）：全部可独立运行功能，只依赖原版 TLM——建造系统（Promaid 手册/工头/全局进度）、LLM AI 工具、挖矿/整理/烹饪/酿造/建造任务、主动对话与情绪价值动作、自主决策、长期记忆、战斗自保、主人死亡传送。本模组零依赖，可单独运行。持久化标识（物品/TaskData/蓝图）保留 maid_smart 命名空间，旧存档兼容。（v1.0.9：撤销 v1.0.7 图腾/濒死背叛保护——经实测女仆“全部消失”实为主人死亡传送误传，相关激活逻辑与开关已移除；主人死亡传送改延迟校验存活，图腾救活不传送。）（v1.2.3：加急修复「收放魂符后血量上限掉回 20」与「拖她的装备被吞」；新增压缩盒、空袭轰炸（末地水晶/重生锚/床/投掷 TNT）、飞行跟随、战斗模式分类表。v1.2.4：激流三叉戟可当飞行推进剂（起飞/空袭抬升俯冲/飞行跟随）、精妙背包与旅行者背包适配、远程空袭「拿着枪一枪不放」与右键蛋糕崩服的修复；压缩盒改为「附魔物品一律禁入」并删掉那两个配置项。）"

